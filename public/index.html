<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>燃やせ！はしごキャンプ</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="埼玉のキャンプ場の予約受付状況をまとめて確認し、キャンプ＋温泉やエリアめぐりの組み合わせを探す">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top__inner">
    <h1 class="brand"><svg class="brand__icon" viewBox="0 0 100 100" aria-hidden="true"><defs><mask id="brandMask"><rect width="100" height="100" fill="#fff"/><g fill="#000"><rect x="27" y="0" width="9" height="100"/><rect x="64" y="0" width="9" height="100"/><rect x="36" y="44" width="28" height="9"/><rect x="36" y="70" width="28" height="9"/></g></mask></defs><path d="M50 4 L97 94 H3 Z" fill="currentColor" mask="url(#brandMask)"/></svg>燃やせ！はしごキャンプ</h1>
    <label class="date-pick">
      <span>泊まる日</span>
      <input type="date" id="stayDate">
    </label>
  </div>
  <nav class="days" id="days" aria-label="泊まる日の候補（土曜・祝日の前日）"></nav>
  <div class="tools">
    <div class="view" role="radiogroup" aria-label="表示">
      <button type="button" data-view="find" aria-pressed="true">さがす</button>
      <button type="button" data-view="onsen" aria-pressed="false">キャンプ＋温泉</button>
      <button type="button" data-view="route" aria-pressed="false">エリアめぐり</button>
    </div>
    <div class="areas" id="areas" role="group" aria-label="エリア"></div>
  </div>
</header>

<main class="main" id="main" aria-live="polite"></main>

<footer class="foot">
  <p>予約受付開始日は、各キャンプ場が公式に案内している受付ルールから計算した目安です。<strong>予約の前に必ず公式サイトで確認してください。</strong></p>
  <p><a href="about.html">このサイトについて</a> ・ <span id="builtAt"></span></p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
