name: データ更新・公開

on:
  schedule:
    # 毎日 5:20（日本時間）。受付開始日の表示は閲覧時に計算するので1日1回で足りる
    - cron: '20 20 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      PROJECT: hashigo-camp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 受付開始日の計算テスト
        run: node scripts/test-booking.mjs

      - name: 空き状況の取得（設定済みの取得元だけ）
        run: node scripts/availability/run.mjs

      - name: データ作成（CSV → JSON）
        run: node scripts/build.mjs

      - name: Cloudflare の設定確認
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録してください"
            exit 1
          fi
          # 貼り付けたときに混ざった空白・改行を取り除く（値そのものはログに出さない）
          ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$ID"; echo "::add-mask::$TOKEN"
          if [ "$ID" != "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::CLOUDFLARE_ACCOUNT_ID に空白か改行が入っていたので取り除きました"; fi
          # ダッシュボードのURL（dash.cloudflare.com/xxxx/...）ごと貼った場合は、32文字のIDだけを取り出す
          if ! printf '%s' "$ID" | grep -Eq '^[0-9a-f]{32}$'; then
            FOUND=$(printf '%s' "$ID" | grep -Eo '[0-9a-f]{32}' | head -1 || true)
            if [ -n "$FOUND" ]; then echo "::warning::CLOUDFLARE_ACCOUNT_ID に余分な文字（${#ID}文字）があったので、32文字のIDだけを使います。Secret を ID だけに直しておくと安心です"; ID=$FOUND; echo "::add-mask::$ID"; fi
          fi
          if ! printf '%s' "$ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID が英数字（0-9, a-f）32文字ではありません（今の長さ: ${#ID}文字）。メールアドレスやアカウント名ではなく、Workers & Pages の右側にある「アカウントID」を入れてください"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ID" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          # トークンの形式を確認（値は出さず、長さと種類だけ）
          if printf '%s' "$TOKEN" | grep -Eq '^[0-9a-f]{37}$'; then
            echo "::warning::CLOUDFLARE_API_TOKEN が「Global API Key」の形式（37文字）です。API Tokens 画面で作るトークンを入れてください"
          else
            echo "トークンの長さ: ${#TOKEN}文字"
          fi
          vcode=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "トークン確認（ユーザーのトークン）: HTTP $vcode"
          acode=$(curl -s -o /tmp/averify.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ID/tokens/verify")
          echo "トークン確認（アカウントのトークン）: HTTP $acode"
          # トークンが有効か・このアカウントを触れるかを確認
          code=$(curl -s -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ID/pages/projects")
          echo "Pages API の応答: HTTP $code"
          node -e 'const r=require("/tmp/cf.json"); for (const e of r.errors||[]) console.log(`::warning::Cloudflare: ${e.code} ${e.message}`)' || true

      - name: Pages プロジェクトを用意（初回のみ作成）
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || echo "既にあるのでそのまま使います"

      - name: Cloudflare Pages へ公開
        run: npx --yes wrangler@3 pages deploy public --project-name="$PROJECT" --branch=main --commit-dirty=true
